# The only workflow that deploys, and the only one that may hold AWS credentials.
#
# It is manual on purpose. There is one environment, the stack publishes real
# snapshots on a schedule, and the first release has no promotion path to catch a
# bad change downstream, so a deployment is a decision someone makes rather than a
# consequence of a merge.
#
# Three things restrict what it can do, and all three have to hold:
#
#   1. `environment: production` requires the approval configured on that
#      environment and refuses any ref its branch policy does not name.
#   2. The AWS role trusts exactly one subject,
#      `repo:nbdSteve/ens-scout:environment:production`, so a token minted by any
#      other repository, branch, or environment cannot assume it.
#   3. The role passes exactly one CloudFormation execution role, which is scoped
#      to this stack's own resources.
#
# Everything this workflow needs to know about the account is a variable on the
# protected `production` environment, and the first step below refuses to build
# anything until all four are present and well formed. Nothing here composes an ARN
# out of parts, and no step prints a value: the account number and the role names are
# public facts about a private deployment, and a workflow file and its logs are the
# two most public places in the repository.
#
# `docs/deployment.md` records the permission sets and what they deliberately
# exclude. No AWS access key is stored in this repository.
name: deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

# Never two deployments at once, and never cancel one in flight: a cancelled
# CloudFormation deployment leaves the stack mid-update.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to ap-southeast-2
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      # The OIDC token this requests is the whole credential path. It is granted on
      # this job alone.
      id-token: write
    steps:
      # The four values this job needs from the account, checked before it builds or
      # deploys anything. It is first for two reasons: a value that is absent or
      # mistyped then costs no checkout, no toolchain, and no synth, and it fails
      # where the reason is legible rather than part-way through a CDK command or,
      # worse, inside a deployment that has already started changing the stack.
      #
      # Only names are printed, never values. This log is readable by anyone who can
      # read the repository.
      #
      # The two ARNs are supplied whole rather than assembled from an account and a
      # role name. Composing one here would put a role name back in this file, and it
      # would also mean a variable could disagree with the ARN this workflow built
      # from it; a full ARN is checked against the account instead, so the four
      # variables have to agree with each other before anything runs.
      - name: require the deployment configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}
          # infra/lib/config.ts `placeholderAccount`, which infra/cdk.json commits so
          # a clean clone can synthesize. Deploying with it would be a deployment
          # aimed at nothing.
          PLACEHOLDER_ACCOUNT: '000000000000'
        run: |
          missing=0
          for name in AWS_ACCOUNT_ID AWS_REGION AWS_DEPLOY_ROLE_ARN AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN; do
            if [ -z "${!name}" ]; then
              echo "::error::variable $name is not set on the production environment"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [[ ! $AWS_ACCOUNT_ID =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ACCOUNT_ID is not exactly twelve digits"
            exit 1
          fi
          if [ "$AWS_ACCOUNT_ID" = "$PLACEHOLDER_ACCOUNT" ]; then
            echo "::error::AWS_ACCOUNT_ID is still the placeholder infra/cdk.json commits"
            exit 1
          fi
          if [[ ! $AWS_REGION =~ ^[a-z]{2}(-[a-z]+)+-[0-9]$ ]]; then
            echo "::error::AWS_REGION is not shaped like an AWS region"
            exit 1
          fi
          for name in AWS_DEPLOY_ROLE_ARN AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN; do
            if [[ ! ${!name} =~ ^arn:aws:iam::${AWS_ACCOUNT_ID}:role/[A-Za-z0-9+=,.@_/-]+$ ]]; then
              echo "::error::$name is not an IAM role ARN in the account AWS_ACCOUNT_ID names"
              exit 1
            fi
          done
          # One role assumed by GitHub, one role assumed only by CloudFormation. The
          # separation is the whole point of the pair, so the same ARN in both is a
          # deployment identity that passes itself.
          if [ "$AWS_DEPLOY_ROLE_ARN" = "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN and AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN name one role"
            exit 1
          fi
          echo "the four production deployment variables are present and consistent"

      # The environment's branch policy already refuses another ref, but that policy
      # is configuration outside this repository, and this is the check a reviewer
      # can see. `workflow_dispatch` also cannot be triggered on a pull request ref,
      # so nothing a pull request produces reaches this job.
      - name: refuse any ref but the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::refusing to deploy $REF; production deploys from refs/heads/$DEFAULT_BRANCH only"
            exit 1
          fi

      - uses: actions/checkout@v7

      # cdk.json bundles the scanner before every CDK command, so the Go toolchain is
      # what produces the artifact this job deploys. That is why the version is pinned
      # rather than floated, and why it is the same pin the checks use: the asset hash
      # is the content hash of this binary, so a different compiler here would deploy a
      # Lambda update for source that did not change, and would do it with a toolchain
      # no pull request had run. checks.yml records the whole reasoning.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - run: npm ci
        working-directory: infra

      # Build and verify once. `npm run check` is tsc --noEmit, the assertion suite,
      # and a synth, and the synth leaves the whole cloud assembly in infra/cdk.out.
      # The deploy step below reads that assembly rather than synthesizing again, so
      # the template and the Lambda bundle that go to AWS are the ones these checks
      # just passed. The bundle is reproducible, so a second synth would produce the
      # same bytes - but "would" is not the same as "did", and this is the step that
      # makes it the same artifact rather than an equal one.
      #
      # The account is supplied here, and only here, because it is a property of the
      # artifact rather than of the deploy command: `--app cdk.out` deploys the
      # assembly this step produced, and the stack environment is baked into it. The
      # trailing arguments reach `cdk synth`, which `npm run check` ends with, so the
      # assembly the assertion suite just verified is the one carrying the real
      # account. Everything else stays in infra/cdk.json.
      - name: build and verify the artifact
        working-directory: infra
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: npm run check -- --context "ens-scout:account=$AWS_ACCOUNT_ID"

      - name: record what is about to be deployed
        working-directory: infra
        run: |
          echo "### Artifact" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "commit  $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          sha256sum cdk.out/EnsScout-prod.template.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: assume the deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          # The role's trust policy already pins the account, so this is a second,
          # local statement of the same fact: a variable edited to name another
          # account's role fails here instead of somewhere inside a deployment.
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: ens-scout-deploy-${{ github.run_id }}

      # `--app cdk.out` deploys the assembly built above and synthesizes nothing new.
      #
      # `--role-arn` is what keeps the deployment identity narrow: CloudFormation
      # creates and updates the stack's resources as the configured execution role, so
      # this job's own role needs no permission over DynamoDB, Lambda, IAM, or
      # anything else the stack contains. It is also the only role the deployment
      # role is permitted to pass, and only to CloudFormation. That is the tie the
      # variable has to honour: the deployment role's `iam:PassRole` names one role,
      # so an ARN naming any other one is denied here rather than widened there.
      #
      # `--require-approval never` answers the CLI's own prompt about IAM changes,
      # which cannot be answered in CI. The human approval is the production
      # environment's, recorded against the deployment.
      - name: deploy
        working-directory: infra
        env:
          AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}
        run: |
          npx cdk deploy EnsScout-prod \
            --app cdk.out \
            --role-arn "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN" \
            --require-approval never
