# The only workflow that deploys, and the only one that may hold AWS credentials.
#
# A successful checks run for a push to this repository's main branch deploys the
# exact commit that run checked. workflow_dispatch remains only as a recovery path;
# it selects the immutable commit at the dispatched main ref and never participates
# in the automatic path.
#
# Three things restrict what it can do, and all three have to hold:
#
#   1. The selector admits only a successful push checks run whose head branch is
#      main and whose head repository is this repository. The deploy job runs only
#      when that selector returns the upstream run's full head SHA.
#   2. The AWS role trusts exactly one subject,
#      `repo:${GITHUB_REPOSITORY_IDENTITY}:environment:production`, so a token minted by any
#      other repository, branch, or environment cannot assume it.
#   3. The role passes exactly one CloudFormation execution role, which is scoped
#      to this stack's own resources.
#
# Everything this workflow needs to know about the account is a variable on the
# protected `production` environment, and the deploy job's first step refuses to
# build anything until all six are present and well formed. Nothing here composes
# an ARN out of parts, and no step prints a value: the account number and the role
# names are public facts about a private deployment, and a workflow file and its
# logs are the two most public places in the repository.
#
# `docs/deployment.md` records the permission sets and what they deliberately
# exclude. No AWS access key is stored in this repository.
name: deploy production

on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never two deployments at once, and never cancel one in flight: a cancelled
# CloudFormation deployment leaves the stack mid-update.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  select:
    name: select the immutable deploy commit
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}
    steps:
      # workflow_run is privileged even when the upstream workflow was a pull
      # request, so the trigger filter is not the authorization boundary. Resolve a
      # SHA only for the one upstream run that may deploy. Invalid events succeed
      # with no output, which skips the deploy job before it can enter the
      # production environment or request an OIDC token.
      - name: resolve the immutable deploy SHA
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          deploy_sha=
          case "$EVENT_NAME" in
            workflow_run)
              if [ "$UPSTREAM_EVENT" = push ] &&
                 [ "$UPSTREAM_CONCLUSION" = success ] &&
                 [ "$UPSTREAM_HEAD_BRANCH" = main ] &&
                 [ "$UPSTREAM_HEAD_REPOSITORY" = "$REPOSITORY" ]; then
                deploy_sha="$UPSTREAM_HEAD_SHA"
              fi
              ;;
            workflow_dispatch)
              if [ "$DISPATCH_REF" = refs/heads/main ]; then
                deploy_sha="$DISPATCH_SHA"
              fi
              ;;
          esac

          if [ -z "$deploy_sha" ]; then
            echo "this event is not eligible for a production deployment"
            exit 0
          fi
          if [[ ! "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::resolved deploy SHA is not a full commit ID"
            exit 1
          fi
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy to ap-southeast-2
    needs: select
    if: needs.select.outputs.deploy_sha != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      # The OIDC token this requests is the whole credential path. It is granted on
      # this job alone.
      id-token: write
    steps:
      # The six values this job needs from the account, checked before it builds or
      # deploys anything. It is first for two reasons: a value that is absent or
      # mistyped then costs no checkout, no toolchain, and no synth, and it fails
      # where the reason is legible rather than part-way through a CDK command or,
      # worse, inside a deployment that has already started changing the stack.
      #
      # Only names are printed, never values. This log is readable by anyone who can
      # read the repository.
      #
      # The two ARNs are supplied whole rather than assembled from an account and a
      # role name. Composing one here would put a role name back in this file, and it
      # would also mean a variable could disagree with the ARN this workflow built
      # from it; a full ARN is checked against the account instead, so all six
      # variables have to agree with each other before anything runs.
      - name: require the deployment configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}
          AWS_ROUTE53_HOSTED_ZONE_ID: ${{ vars.AWS_ROUTE53_HOSTED_ZONE_ID }}
          AWS_ACM_CERTIFICATE_ARN: ${{ vars.AWS_ACM_CERTIFICATE_ARN }}
          # infra/lib/config.ts `placeholderAccount`, which infra/cdk.json commits so
          # a clean clone can synthesize. Deploying with it would be a deployment
          # aimed at nothing.
          PLACEHOLDER_ACCOUNT: '000000000000'
        run: |
          missing=0
          for name in AWS_ACCOUNT_ID AWS_REGION AWS_DEPLOY_ROLE_ARN AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN AWS_ROUTE53_HOSTED_ZONE_ID AWS_ACM_CERTIFICATE_ARN; do
            if [ -z "${!name}" ]; then
              echo "::error::variable $name is not set on the production environment"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [[ ! $AWS_ACCOUNT_ID =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ACCOUNT_ID is not exactly twelve digits"
            exit 1
          fi
          if [ "$AWS_ACCOUNT_ID" = "$PLACEHOLDER_ACCOUNT" ]; then
            echo "::error::AWS_ACCOUNT_ID is still the placeholder infra/cdk.json commits"
            exit 1
          fi
          if [[ ! $AWS_REGION =~ ^[a-z]{2}(-[a-z]+)+-[0-9]$ ]]; then
            echo "::error::AWS_REGION is not shaped like an AWS region"
            exit 1
          fi
          if [[ ! $AWS_ROUTE53_HOSTED_ZONE_ID =~ ^Z[A-Z0-9]{10,31}$ ]]; then
            echo "::error::AWS_ROUTE53_HOSTED_ZONE_ID is not shaped like a Route 53 hosted-zone ID"
            exit 1
          fi
          if [[ ! $AWS_ACM_CERTIFICATE_ARN =~ ^arn:aws:acm:us-east-1:${AWS_ACCOUNT_ID}:certificate/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error::AWS_ACM_CERTIFICATE_ARN is not a us-east-1 ACM certificate ARN in the account AWS_ACCOUNT_ID names"
            exit 1
          fi
          for name in AWS_DEPLOY_ROLE_ARN AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN; do
            if [[ ! ${!name} =~ ^arn:aws:iam::${AWS_ACCOUNT_ID}:role/[A-Za-z0-9+=,.@_/-]+$ ]]; then
              echo "::error::$name is not an IAM role ARN in the account AWS_ACCOUNT_ID names"
              exit 1
            fi
          done
          # One role assumed by GitHub, one role assumed only by CloudFormation. The
          # separation is the whole point of the pair, so the same ARN in both is a
          # deployment identity that passes itself.
          if [ "$AWS_DEPLOY_ROLE_ARN" = "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN and AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN name one role"
            exit 1
          fi
          echo "the six production deployment variables are present and consistent"

      # Checkout the one full SHA the selector admitted. In the automatic path this
      # is github.event.workflow_run.head_sha, not the deploy workflow's own SHA and
      # not a branch that could move after the checks completed.
      - name: checkout the selected commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.deploy_sha }}
          persist-credentials: false

      - name: verify the selected commit
        env:
          DEPLOY_SHA: ${{ needs.select.outputs.deploy_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$DEPLOY_SHA" ]; then
            echo "::error::checkout did not resolve to the selected deploy SHA"
            exit 1
          fi

      # cdk.json bundles the scanner before every CDK command, so the Go toolchain is
      # what produces the artifact this job deploys. That is why the version is pinned
      # rather than floated, and why it is the same pin the checks use: the asset hash
      # is the content hash of this binary, so a different compiler here would deploy a
      # Lambda update for source that did not change, and would do it with a toolchain
      # no pull request had run. checks.yml records the whole reasoning.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json
            web/package-lock.json

      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: infra

      # This is the bundle the CDK synth below packages. A same-origin base of `/`
      # keeps the browser on whichever hostname reached the CloudFront distribution
      # for both static files and /api/*, and keeps every Graph and AWS value out of
      # the Vite environment.
      - name: build the production website
        working-directory: web
        env:
          VITE_API_BASE_URL: /
        run: npm run build

      # Build and verify once. `npm run check` is tsc --noEmit, the assertion suite,
      # and a synth, and the synth leaves the whole cloud assembly in infra/cdk.out.
      # The deploy step below reads that assembly rather than synthesizing again, so
      # the template and the Lambda bundle that go to AWS are the ones these checks
      # just passed. The bundle is reproducible, so a second synth would produce the
      # same bytes - but "would" is not the same as "did", and this is the step that
      # makes it the same artifact rather than an equal one.
      #
      # The account is supplied here, and only here, because it is a property of the
      # artifact rather than of the deploy command: `--app cdk.out` deploys the
      # assembly this step produced, and the stack environment is baked into it. The
      # trailing arguments reach `cdk synth`, which `npm run check` ends with, so the
      # assembly the assertion suite just verified is the one carrying the real
      # account. Everything else stays in infra/cdk.json.
      - name: build and verify the artifact
        working-directory: infra
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROUTE53_HOSTED_ZONE_ID: ${{ vars.AWS_ROUTE53_HOSTED_ZONE_ID }}
          AWS_ACM_CERTIFICATE_ARN: ${{ vars.AWS_ACM_CERTIFICATE_ARN }}
        run: npm run check -- --context "ens-scout:account=$AWS_ACCOUNT_ID" --context "ens-scout:siteHostedZoneId=$AWS_ROUTE53_HOSTED_ZONE_ID" --context "ens-scout:siteCertificateArn=$AWS_ACM_CERTIFICATE_ARN"

      - name: record what is about to be deployed
        working-directory: infra
        env:
          DEPLOY_SHA: ${{ needs.select.outputs.deploy_sha }}
        run: |
          {
            echo "### Artifact"
            echo '```'
            echo "commit  $DEPLOY_SHA"
            sha256sum cdk.out/EnsScout-prod.template.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: assume the deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          # The role's trust policy already pins the account, so this is a second,
          # local statement of the same fact: a variable edited to name another
          # account's role fails here instead of somewhere inside a deployment.
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: ens-scout-deploy-${{ github.run_id }}

      # `--app cdk.out` deploys the assembly built above and synthesizes nothing new.
      #
      # `--role-arn` is what keeps the deployment identity narrow: CloudFormation
      # creates and updates the stack's resources as the configured execution role, so
      # this job's own role needs no permission over DynamoDB, Lambda, IAM, or
      # anything else the stack contains. It is also the only role the deployment
      # role is permitted to pass, and only to CloudFormation. That is the tie the
      # variable has to honour: the deployment role's `iam:PassRole` names one role,
      # so an ARN naming any other one is denied here rather than widened there.
      #
      # `--require-approval never` answers the CLI's own prompt about IAM changes,
      # which cannot participate in an unattended automatic deployment.
      - name: deploy
        working-directory: infra
        env:
          AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}
        run: |
          deploy_log="$(mktemp)"
          trap 'rm -f "$deploy_log"' EXIT
          if ! npx cdk deploy EnsScout-prod \
              --app cdk.out \
              --role-arn "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN" \
              --require-approval never \
              --progress errors-only \
              --no-color \
              --outputs-file cdk-outputs.json >"$deploy_log" 2>&1; then
            echo "::error::CDK deployment failed; inspect the protected production stack events"
            exit 1
          fi

      - name: publish the generated site URL
        working-directory: infra
        run: |
          site_url="$(node -e "
            const outputs = require('./cdk-outputs.json');
            const url = outputs['EnsScout-prod']?.PublicSiteUrl;
            if (typeof url !== 'string' || !url.startsWith('https://')) process.exit(1);
            process.stdout.write(url);
          ")"
          {
            echo "### Public site"
            echo "$site_url"
          } >> "$GITHUB_STEP_SUMMARY"
