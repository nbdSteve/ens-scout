# Repository-scoped no-mistakes configuration.
#
# The pipeline agent for this repository. One agent is resolved per run and it
# drives every agent-driven step, review, test, lint, document, PR and CI fix
# alike, because no-mistakes has no per-step agent setting. Set here rather than
# globally so the choice applies to ens-scout alone and leaves every other
# repository on the global default. no-mistakes only honours this value once it
# is on the trusted default branch, so a feature branch cannot select its own
# pipeline agent.
agent: codex
